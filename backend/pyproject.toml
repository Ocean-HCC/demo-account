[project]
name = "demo-account"
version = "0.1.0"
description = "A 股模拟券商柜台：账户、下单、撮合、持仓、净值"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.scripts]
demo-account = "demo_account.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的惯用写法
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["demo_account.core", "demo_account.services"]
